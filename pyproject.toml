[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-ai"
version = "0.1.0"
description = "AI-powered & deterministic test failure root-cause analyzer for Python & Django"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Kiruthickraj" }
]
keywords = [
    "pytest",
    "django",
    "testing",
    "triage",
    "ai",
    "llm",
    "developer-tools",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Kiruthickraj004/python-triage"
Repository = "https://github.com/Kiruthickraj004/python-triage"
Issues = "https://github.com/Kiruthickraj004/python-triage/issues"

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
